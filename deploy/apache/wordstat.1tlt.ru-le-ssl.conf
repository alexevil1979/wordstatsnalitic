# HTTPS → Next.js (systemd, port 3010)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName wordstat.1tlt.ru

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/wordstat.1tlt.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wordstat.1tlt.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog ${APACHE_LOG_DIR}/wordstat.1tlt.ru-error.log
    CustomLog ${APACHE_LOG_DIR}/wordstat.1tlt.ru-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://127.0.0.1:3010/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://127.0.0.1:3010/
</VirtualHost>
</IfModule>
