services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wordstat
      POSTGRES_PASSWORD: wordstat
      POSTGRES_DB: wordstat
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wordstat_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - wordstat_redis:/data

volumes:
  wordstat_pg:
  wordstat_redis:
